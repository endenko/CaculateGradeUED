services:
  - type: web
    name: ued-calculate-grade
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python seed_db.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: OCR_LIGHT
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: RAPID_LIMIT_SIDE
        value: "960"
      # Render's hidden default is "--preload --access-logfile - --bind=...".
      # Preload forks away the OCR thread. Override it; the app also restarts
      # the consumer after fork if preload is turned back on.
      - key: GUNICORN_CMD_ARGS
        value: "--access-logfile -"
